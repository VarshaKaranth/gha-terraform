name: CI/CD Pipeline

on:
    push:
        branches:
        - master
        - feature/*

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            greeting: ${{ steps.set-greeting.outputs.greeting }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Generate greeting message
              id: set-greeting
              run: |
                  Greeting="Hello, GitHub Actions!"
                  echo "Generated greeting: $Greeting"
                  echo "::set-output name=greeting::$Greeting"

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '14'
            
            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Use generated greeting
              run: |
                  echo "The greeting message is: ${{ needs.build.outputs.greeting }}"
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-west-2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v1

            - name: Terraform Init
              run: terraform init

            - name: Terraform Plan
              run: terraform plan
