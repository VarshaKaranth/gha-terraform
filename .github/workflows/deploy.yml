name: CI/CD Pipeline

on:
    push:
        branches:
        - master
        - feature/*

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            example-output: ${{ steps.set-output-step.outputs.example }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set Output
              id: set-output-step
              run: echo "::set-output name=example::Hello from build"

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '14'
            
            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Use output from build
              run: echo "The output from build is ${{ needs.build.outputs.example-output }}"
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-west-2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v1

            - name: Terraform Init
              run: terraform init

            - name: Terraform Plan
              run: terraform plan
